name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    # On PATH for PyO3's build script (cargo clippy); runners default to a newer Python.
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: ${{ matrix.python }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Check Rust formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy -- -D warnings

    - name: Install dependencies and build the Rust extension
      run: uv sync --all-extras

    - name: Check Python formatting and linting (ruff)
      run: |
        uv run ruff format --check .
        uv run ruff check .

    - name: Type check Python (mypy)
      run: uv run mypy src tests

    - name: Run pytest with branch coverage
      run: uv run pytest --cov=mapcv --cov-branch --cov-report=term --cov-report=xml --cov-fail-under=65

    - name: Upload Python coverage
      if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
      uses: codecov/codecov-action@v7
      with:
        files: coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: Smoke-test optional EOPF imports
      run: uv run python -c "import xarray; import xarray_eopf"
