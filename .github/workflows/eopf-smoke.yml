name: EOPF public smoke test

on:
  # Weekly against a pinned public product, so a change on the provider's side (or in
  # xarray-eopf) shows up before a user meets it; on demand with any product.
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      product_url:
        description: Anonymous public Sentinel-2 L2A EOPF Zarr product URL (default the pinned one)
        required: false
        type: string

env:
  # The product the Sentinel-2 example and tutorial use.
  PINNED_PRODUCT: https://objectstore.eodc.eu:2222/e05ab01a9d56408d82ac32d69a5aae2a:202505-s02msil2a/13/products/cpm_v256/S2A_MSIL2A_20250513T104041_N0511_R008_T31UFT_20250513T143716.zarr

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install mapcv with EOPF support
        run: uv sync --extra zarr --extra dev
      - name: Run public EOPF integration test
        env:
          MAPCV_EOPF_URL: ${{ inputs.product_url || env.PINNED_PRODUCT }}
        run: uv run pytest -m eopf_live -v
