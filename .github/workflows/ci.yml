name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer push to the same PR or branch supersedes the running checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Platform-independent checks run once: formatting, lints, types and the Rust unit tests.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # On PATH for PyO3's build script (cargo clippy, cargo test).
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: "3.13"
        enable-cache: true
        cache-dependency-glob: uv.lock
        # PRs restore main's caches but do not save their own (10 GB cache budget).
        save-cache: ${{ github.ref == 'refs/heads/main' }}

    # Installs the toolchain pinned in rust-toolchain.toml.
    - name: Install Rust toolchain
      run: rustup toolchain install

    - name: Cache Rust build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Check Rust formatting
      run: cargo fmt --check

    - name: Run clippy
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Run Rust unit tests
      run: cargo test --locked

    - name: Check Rust licences, advisories and sources (cargo-deny)
      uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      with:
        command: check
        arguments: --all-features

    # The wheels must ship a notice for every crate they link (about.toml, about.hbs).
    - name: Install cargo-about
      uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
      with:
        tool: cargo-about@0.9.2

    - name: Check the bundled licence notices are up to date (cargo-about)
      run: |
        cargo about generate --locked --fail --all-features -c about.toml -o LICENSES-THIRD-PARTY.md about.hbs
        git diff --exit-code -- LICENSES-THIRD-PARTY.md || {
          echo "::error file=LICENSES-THIRD-PARTY.md::The licence notices are out of date. Run: cargo about generate --locked --fail --all-features -c about.toml -o LICENSES-THIRD-PARTY.md about.hbs"
          exit 1
        }

    # The checks below read the sources; building the extension is the test job's work.
    - name: Install dependencies
      run: uv sync --locked --all-extras --no-install-project

    - name: Check Python formatting and linting (ruff)
      run: |
        uv run --no-sync ruff format --check .
        uv run --no-sync ruff check .

    - name: Type check Python (mypy)
      run: uv run --no-sync mypy src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # The runner's cached interpreter, so uv does not download one.
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python }}

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: ${{ matrix.python }}
        enable-cache: true
        cache-dependency-glob: uv.lock
        # PRs restore main's caches but do not save their own (10 GB cache budget).
        save-cache: ${{ github.ref == 'refs/heads/main' }}

    # Installs the toolchain pinned in rust-toolchain.toml.
    - name: Install Rust toolchain
      run: rustup toolchain install

    - name: Cache Rust build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    # --reinstall-package: always build the extension from this commit, never a cached wheel.
    - name: Install dependencies and build the Rust extension
      run: uv sync --locked --all-extras --reinstall-package mapcv

    - name: Run pytest with branch coverage
      run: uv run pytest --cov=mapcv --cov-branch --cov-report=term --cov-report=xml --cov-fail-under=65

    - name: End-to-end user journey (real CLI, wizard, generate, resume, split)
      shell: bash
      run: uv run python tests/e2e/journey.py --version "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"

    - name: Upload Python coverage
      if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: Smoke-test optional EOPF imports
      if: matrix.python != '3.14'
      run: uv run python -c "import xarray; import xarray_eopf"
