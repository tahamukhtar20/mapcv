name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # ── Version consistency check ─────────────────────────────────────────────────
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the tag points at a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main; releases are cut from main only"
            exit 1
          fi
      - name: Verify CHANGELOG.md has a dated section for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/changelog_section.py "$VERSION" > /dev/null
          if ! grep -Eq "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::Date the CHANGELOG.md heading, e.g. '## [${VERSION}] - $(date +%F)'"
            exit 1
          fi
      - name: Verify tag matches pyproject.toml and Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          CARGO=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          echo "Tag:          $TAG"
          echo "pyproject.toml: $PYPROJECT"
          echo "Cargo.toml:     $CARGO"

          if [ "$TAG" != "$PYPROJECT" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $PYPROJECT"
            exit 1
          fi
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CARGO"
            exit 1
          fi
          echo "All versions match: $TAG"

  # ── Linux (manylinux, x86-64) ────────────────────────────────────────────────
  linux:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          command: build
          # abi3 (cp310-abi3): one wheel serves Python 3.10 and newer.
          args: --release --locked --sdist -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: dist

  # ── macOS (universal2 — runs on both Intel and Apple Silicon) ────────────────
  macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: universal2-apple-darwin
          args: --release --locked -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos
          path: dist

  # ── Windows (x86-64) ─────────────────────────────────────────────────────────
  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows
          path: dist

  # ── Test the wheels on every OS and the sdist before publishing ──────────────
  test-wheel:
    needs: [linux, macos, windows]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Check distribution metadata
        run: |
          pip install twine
          twine check --strict dist/*
          python - <<'EOF'
          import glob, zipfile
          from email.parser import Parser
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheels built"
          assert all("-cp310-abi3-" in whl for whl in wheels), wheels
          for whl in wheels:
              with zipfile.ZipFile(whl) as zf:
                  name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
                  meta = Parser().parsestr(zf.read(name).decode())
              assert meta["Requires-Python"] == ">=3.10", (whl, meta["Requires-Python"])
              classifiers = meta.get_all("Classifier") or []
              for minor in ("3.10", "3.11", "3.12", "3.13", "3.14"):
                  assert f"Programming Language :: Python :: {minor}" in classifiers, (whl, minor)
          print(f"metadata OK for {len(wheels)} wheels")
          EOF
      - name: Install the built wheel and test dependencies
        run: |
          # Pin the tag's version so pip cannot pick a newer release from PyPI.
          VERSION="${GITHUB_REF_NAME#v}"
          pip install --only-binary mapcv --find-links dist "mapcv==${VERSION}"
          python -c "import mapcv"
          if [ "${{ matrix.python }}" != "3.14" ]; then
            pip install --only-binary mapcv --find-links dist "mapcv[zarr]==${VERSION}"
            python -c "import xarray; import xarray_eopf"
          fi
          pip install pytest pytest-httpserver pytest-cov mercantile
      - name: Run tests against the installed wheel
        run: |
          mv src src.unused
          pytest --cov=mapcv --cov-branch --cov-fail-under=65

  test-sdist:
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Build and test from the sdist
        run: |
          pip install --no-binary mapcv dist/*.tar.gz pytest pytest-httpserver mercantile
          tar xzf dist/*.tar.gz
          cd mapcv-*/ && rm -rf src && python -m pytest -q

  # ── Publish to PyPI (OIDC only; needs approval in the pypi environment) ──────
  publish-pypi:
    needs: [test-wheel, test-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── GitHub release with notes from CHANGELOG.md ──────────────────────────────
  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Extract release notes
        run: python scripts/changelog_section.py "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
