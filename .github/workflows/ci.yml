name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
        
    - name: Install uv
      uses: astral-sh/setup-uv@v9
        
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
        
    - name: Install dependencies
      run: |
        uv sync --all-extras
        
    - name: Check Rust formatting
      run: cargo fmt -- --check
      
    - name: Run clippy
      run: cargo clippy -- -D warnings
      
    - name: Build and install package (including Rust extension)
      run: uv pip install -e .
      
    - name: Check Python formatting and linting (ruff)
      run: uv run ruff check .
      
    - name: Type check Python (mypy)
      run: uv run mypy src tests
      
    - name: Run pytest with branch coverage
      run: uv run pytest --cov=mapcv --cov-branch --cov-report=term --cov-report=xml --cov-fail-under=65

    - name: Upload Python coverage
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        files: coverage.xml
        fail_ci_if_error: false

    - name: Smoke-test optional EOPF imports
      run: uv run python -c "import xarray; import xarray_eopf"
