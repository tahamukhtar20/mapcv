name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry run: build and test every artifact on every platform, publish nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Version consistency check ─────────────────────────────────────────────────
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the tag points at a commit on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main; releases are cut from main only"
            exit 1
          fi
      - name: Verify CHANGELOG.md has a dated section for this version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          python scripts/changelog_section.py "$VERSION" > /dev/null
          if ! grep -Eq "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::Date the CHANGELOG.md heading, e.g. '## [${VERSION}] - $(date +%F)'"
            exit 1
          fi
      - name: Verify tag matches pyproject.toml and Cargo.toml
        id: versions
        run: |
          PYPROJECT=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          CARGO=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # A dry run (no tag) checks the version files against each other.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then TAG="${GITHUB_REF_NAME#v}"; else TAG="$PYPROJECT"; fi
          echo "version=$PYPROJECT" >> "$GITHUB_OUTPUT"

          echo "Tag:          $TAG"
          echo "pyproject.toml: $PYPROJECT"
          echo "Cargo.toml:     $CARGO"

          if [ "$TAG" != "$PYPROJECT" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $PYPROJECT"
            exit 1
          fi
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CARGO"
            exit 1
          fi
          echo "All versions match: $TAG"

  # ── Linux: glibc (manylinux) and musl (Alpine), x86-64 and aarch64 ───────────
  # aarch64 builds natively on ARM runners; Docker on Apple Silicon, Graviton and
  # Raspberry Pi use these wheels.
  linux:
    needs: check-version
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64, libc: manylinux, manylinux: auto, sdist: --sdist }
          - { runner: ubuntu-24.04-arm, target: aarch64, libc: manylinux, manylinux: auto, sdist: "" }
          - { runner: ubuntu-latest, target: x86_64, libc: musllinux, manylinux: musllinux_1_2, sdist: "" }
          - { runner: ubuntu-24.04-arm, target: aarch64, libc: musllinux, manylinux: musllinux_1_2, sdist: "" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          command: build
          # abi3 (cp310-abi3): one wheel serves Python 3.10 and newer.
          args: --release --locked ${{ matrix.sdist }} -o dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # wheels-linux-x86_64 also carries the sdist.
          name: ${{ matrix.libc == 'manylinux' && 'wheels-linux' || 'wheels-musllinux' }}-${{ matrix.target }}
          path: dist

  # ── macOS (universal2 — runs on both Intel and Apple Silicon) ────────────────
  macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: universal2-apple-darwin
          args: --release --locked -o dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos
          path: dist

  # ── Windows (x86-64) ─────────────────────────────────────────────────────────
  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --locked -o dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows
          path: dist

  # ── Test the wheels on every OS and the sdist before publishing ──────────────
  test-wheel:
    needs: [check-version, linux, macos, windows]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Install test tools (pinned by hash)
        run: pip install --require-hashes -r .github/requirements/release-test.txt
      - name: Check distribution metadata
        run: |
          twine check --strict dist/*
          python - <<'EOF'
          import glob, zipfile
          from email.parser import Parser
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheels built"
          assert all("-cp310-abi3-" in whl for whl in wheels), wheels
          platforms = ("manylinux", "musllinux", "macosx", "win_amd64")
          for tag in platforms:
              assert any(tag in whl for whl in wheels), (tag, wheels)
          for arch in ("x86_64", "aarch64"):
              assert sum(arch in whl for whl in wheels) >= 2, (arch, wheels)
          for whl in wheels:
              with zipfile.ZipFile(whl) as zf:
                  name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
                  meta = Parser().parsestr(zf.read(name).decode())
              assert meta["Requires-Python"] == ">=3.10", (whl, meta["Requires-Python"])
              classifiers = meta.get_all("Classifier") or []
              for minor in ("3.10", "3.11", "3.12", "3.13", "3.14"):
                  assert f"Programming Language :: Python :: {minor}" in classifiers, (whl, minor)
          print(f"metadata OK for {len(wheels)} wheels")
          EOF
      - name: Install the built wheel and test dependencies
        run: |
          # mapcv from dist only: the same version may already be on PyPI (a dry run
          # of a released version), and pip would happily take that wheel instead.
          pip install --no-index --no-deps --only-binary :all: --find-links dist "mapcv==${VERSION}"
          # Then its dependencies from PyPI; the installed mapcv already satisfies the pin.
          pip install --only-binary mapcv --find-links dist "mapcv==${VERSION}"
          python scripts/check_installed_wheel.py dist
          python -c "import mapcv"
          if [ "${{ matrix.python }}" != "3.14" ]; then
            pip install --only-binary mapcv --find-links dist "mapcv[zarr]==${VERSION}"
            python -c "import xarray; import xarray_eopf"
            python scripts/check_installed_wheel.py dist
          fi
      - name: Run tests against the installed wheel
        run: |
          mv src src.unused
          pytest --cov=mapcv --cov-branch --cov-fail-under=65
      - name: End-to-end user journey (installed CLI, wizard, generate, resume, split)
        run: python tests/e2e/journey.py --version "$VERSION"
      - name: Live quickstart with Esri imagery (dry run only)
        if: github.event_name == 'workflow_dispatch' && matrix.python == '3.14'
        continue-on-error: true
        working-directory: examples/quickstart
        run: |
          mapcv generate mapcv.yaml --yes
          mapcv info dataset

  # Alpine (musl) has no glibc; run the musllinux wheels in a python:alpine container.
  test-musl:
    needs: [check-version, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist
      - name: Test the wheel on Alpine
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: >-
          docker run --rm -e VERSION -v "$PWD:/src" -w /src
          python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          sh -euc 'pip install -q --require-hashes -r .github/requirements/release-test.txt
          && pip install -q --no-index --no-deps --only-binary :all: --find-links dist "mapcv==$VERSION"
          && pip install -q --only-binary :all: --find-links dist "mapcv==$VERSION"
          && python scripts/check_installed_wheel.py dist
          && mv src src.unused && python -m pytest -q
          && python tests/e2e/journey.py --version "$VERSION"'

  test-sdist:
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/requirements
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Build and test from the sdist
        run: |
          pip install --require-hashes -r .github/requirements/release-test.txt
          pip install --no-binary mapcv dist/*.tar.gz
          tar xzf dist/*.tar.gz
          cd mapcv-*/ && rm -rf src && python -m pytest -q

  # ── Publish to PyPI (OIDC only; needs approval in the pypi environment) ──────
  publish-pypi:
    if: github.event_name == 'push'
    needs: [test-wheel, test-musl, test-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # ── GitHub release with notes from CHANGELOG.md ──────────────────────────────
  # Build provenance for every wheel and the sdist: stored by GitHub (verify with
  # `gh attestation verify <file> --repo tahamukhtar20/mapcv`) and attached to the release.
  github-release:
    if: github.event_name == 'push'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Extract release notes and name the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          python scripts/changelog_section.py "${GITHUB_REF_NAME#v}" > release-notes.md
          cp "$BUNDLE" "mapcv-${GITHUB_REF_NAME#v}.intoto.jsonl"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* mapcv-*.intoto.jsonl
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "$GITHUB_REF_NAME" --notes-file release-notes.md
