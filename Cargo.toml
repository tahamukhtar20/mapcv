[package]
name = "mapcv_rs"
version = "0.2.0"
edition = "2021"

[lib]
name = "_mapcv_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module"] }
numpy = "0.29"
ndarray = "0.17"
image = "0.25.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rayon = "1"
quick-xml = { version = "0.37", features = ["encoding"] }

[lints.rust]
missing_docs = "deny"

[lints.clippy]
pedantic = "deny"
