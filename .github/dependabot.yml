version: 2
updates:
  - package-ecosystem: uv
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "ci(deps)"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
