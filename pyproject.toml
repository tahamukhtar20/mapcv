[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "mapcv"
version = "0.2.0"
description = "A high-performance satellite imagery dataset creation tool for computer vision"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Muhammad Taha Mukhtar", email = "tahamukhtar20@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
keywords = [
    "remote-sensing",
    "satellite-imagery",
    "semantic-segmentation",
    "computer-vision",
    "dataset",
    "geospatial",
    "sentinel-2",
    "xyz-tiles",
]
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "shapely>=2.0",
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "typing_extensions>=4.6",
]

[project.urls]
Homepage = "https://tahamukhtar20.github.io/mapcv/"
Documentation = "https://tahamukhtar20.github.io/mapcv/"
Repository = "https://github.com/tahamukhtar20/mapcv"
Issues = "https://github.com/tahamukhtar20/mapcv/issues"
Changelog = "https://github.com/tahamukhtar20/mapcv/blob/main/CHANGELOG.md"

[project.scripts]
mapcv = "mapcv.cli:app"

[project.optional-dependencies]
dev = [
    "maturin",
    "pytest",
    "pytest-httpserver",
    "mypy",
    "ruff",
    "pre-commit",
    "mercantile",
    "pytest-cov",
]
docs = [
    "matplotlib",
    "ipywidgets",
]
zarr = [
    "xarray-eopf==0.2.5; python_version < '3.11'",
    "xarray-eopf>=0.2.9,<0.3; python_version >= '3.11'",
    "xarray>=2024.10",
    "dask[array]>=2024.10",
    "numba>=0.61",
    "zarr>=2.18,<3",
    "pyproj>=3.6",
    "s3fs>=2024.10",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "mapcv._mapcv_rs"
python-source = "src"
# Keep the sdist to what is needed to build and test: no docs site, CI config,
# or notebooks (the demo notebook embeds third-party imagery).
exclude = [
    { path = "website/**/*", format = "sdist" },
    { path = "examples/**/*", format = "sdist" },
    { path = ".github/**/*", format = "sdist" },
    { path = "uv.lock", format = "sdist" },
    { path = ".pre-commit-config.yaml", format = "sdist" },
    { path = "cliff.toml", format = "sdist" },
]

[tool.mypy]
strict = true
exclude = ["tests/generate_golden\\.py"]

[[tool.mypy.overrides]]
module = [
    "mapcv._mapcv_rs",
    "mercantile",
    "shapely",
    "shapely.*",
    "rasterio",
    "rasterio.*",
    "yaml",
    "xarray",
    "xarray.*",
    "pyproj",
    "pyproj.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eopf_live: opt-in integration test against a public EOPF product",
]

[tool.coverage.run]
branch = true
source = ["mapcv"]
omit = [
    "src/mapcv/_mapcv_rs*",
]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
