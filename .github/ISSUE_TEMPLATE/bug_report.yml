name: Bug Report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in as much detail as possible. Issues without reproduction steps may be closed.

  - type: input
    id: version
    attributes:
      label: mapcv version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.3"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Ubuntu 24.04, macOS 14, Windows 11"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Config file (if applicable)
      description: Paste your YAML config, redacting any sensitive URLs or paths.
      render: yaml

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `mapcv generate config.yaml`
        2. ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Paste the full error message or traceback.
      render: text
