version: 2
updates:
  - package-ecosystem: uv
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]

  # .github/requirements is left out on purpose: Dependabot recompiles it for one
  # Python and platform, which drops the markers release.yml needs. Recompile it with
  # the command at the top of each .in file.

  - package-ecosystem: cargo
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "ci(deps)"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /website
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      website-dependencies:
        patterns: ["*"]

  # The Rust version pinned in rust-toolchain.toml.
  - package-ecosystem: rust-toolchain
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
