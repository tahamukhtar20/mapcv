name: Paper

# Build the JOSS paper draft (paper/paper.md) with the journal's own toolchain, so the
# PDF a reviewer sees can be checked before submission. Runs only when the paper changes.
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  push:
    branches: [ "main" ]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper:
    name: Paper draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Open Journals PDF generator (what openjournals-draft-action runs), pinned by
      # digest: the action itself pulls the image's moving `latest` tag.
      - name: Build draft PDF
        uses: docker://openjournals/inara@sha256:a0414b8b72fd8923917ede614d340d98dc7aa3102aabc2e955e9c02a6100fd62
        env:
          GIT_SHA: ${{ github.sha }}
          JOURNAL: joss
        with:
          args: -o pdf paper/paper.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper
          path: paper/paper.pdf
          if-no-files-found: error
