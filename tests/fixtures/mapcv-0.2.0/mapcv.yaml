# A dataset generated by mapcv 0.2.0 from PyPI (`mapcv generate mapcv.yaml --yes`) against a
# local tile server whose tile (x, y) at zoom z is the solid colour
# ((37x) % 256, (53y) % 256, 9z); see tests/test_manifest.py. PORT is that server's port.
region: {west: 4.9822999046875, south: 52.41079678778849, east: 4.986419577734375, north: 52.41247195962485}
imagery:
  type: xyz
  zoom: 18
  url_template: http://127.0.0.1:PORT/{z}/{x}/{y}.png
labels:
  path: labels.geojson
  label_field: class
sampler:
  patch_size: 192
  stride: 192
  edge_strategy: pad
writer:
  staging_dir: dataset
split:
  test_ratio: 0.25
  val_ratio: 0.2
  labeled_ratios: [0.5]
