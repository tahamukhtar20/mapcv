# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews every PR; conventions live in AGENTS.md (read via code_guidelines).
language: en-US

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main"]
  path_filters:
    - "!**/Cargo.lock"
    - "!**/uv.lock"
    - "!website/package-lock.json"
    - "!tests/fixtures/**"
    - "!website/src/cli-help/**"
  path_instructions:
    - path: "src/**/*.rs"
      instructions: >-
        Rust core of a GDAL-free geospatial tool. Flag any panic reachable from Python input
        (unwrap/expect/indexing/arithmetic overflow on user data), unbounded allocation, and
        floating-point or off-by-half-pixel mistakes in transforms and rasterization. The
        rasterizer intentionally mirrors GDAL's tie rules; don't suggest "simplifications" that
        change them. Long work should release the GIL (py.detach).
    - path: "src/mapcv/**/*.py"
      instructions: >-
        Check CRS handling (lon/lat axis order, reprojection direction), pixel-centre vs
        pixel-corner conventions, determinism (seeded randomness, ordered output, LF line
        endings), resume compatibility (manifest fields), and that user-facing errors are
        actionable without tracebacks. Config models use extra="forbid".
    - path: "src/mapcv/manifest.py"
      instructions: >-
        manifest.json is a public format (v3, also reading v1/v2). Any field change must keep
        old manifests loading and needs a migration note.
    - path: "tests/**"
      instructions: >-
        Prefer comparisons against independent references (rasterio, shapely, pycocotools) over
        hand-picked expected values; tests needing optional libraries use pytest.importorskip.
    - path: ".github/workflows/**"
      instructions: >-
        Actions are pinned by full commit SHA; jobs use least-privilege permissions and
        persist-credentials: false. Required check names on main must not change.
    - path: "website/**"
      instructions: >-
        User docs: commands and outputs must match the current CLI exactly; keep the user journey
        (install, quickstart, tutorials) short and accurate.
  tools:
    ruff:
      enabled: true
    clippy:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: false
    yamllint:
      enabled: true
    shellcheck:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CONTRIBUTING.md"

chat:
  auto_reply: true
