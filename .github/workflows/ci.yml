name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer push to the same PR or branch supersedes the running checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # On PATH for PyO3's build script (cargo clippy); runners default to a newer Python.
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python }}

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: ${{ matrix.python }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      with:
        components: clippy, rustfmt

    - name: Check Rust formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Install dependencies and build the Rust extension
      run: uv sync --all-extras

    - name: Check Python formatting and linting (ruff)
      run: |
        uv run ruff format --check .
        uv run ruff check .

    - name: Type check Python (mypy)
      run: uv run mypy src tests

    - name: Run pytest with branch coverage
      run: uv run pytest --cov=mapcv --cov-branch --cov-report=term --cov-report=xml --cov-fail-under=65

    - name: Upload Python coverage
      if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: Smoke-test optional EOPF imports
      if: matrix.python != '3.14'
      run: uv run python -c "import xarray; import xarray_eopf"
