name: EOPF public smoke test

on:
  workflow_dispatch:
    inputs:
      product_url:
        description: Anonymous public Sentinel-2 L2A EOPF Zarr product URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install mapcv with EOPF support
        run: uv sync --extra zarr --extra dev
      - name: Run public EOPF integration test
        env:
          MAPCV_EOPF_URL: ${{ inputs.product_url }}
        run: uv run pytest -m eopf_live -v
