[package]
name = "mapcv_rs"
version = "0.2.0"
edition = "2021"
description = "Rust core of mapcv: tile fetching and decoding, rasterization, GeoTIFF I/O and patch writing"
license = "MIT"
repository = "https://github.com/tahamukhtar20/mapcv"
publish = false

[lib]
name = "_mapcv_rs"
# `rlib` lets the fuzz crate (fuzz/) link the parsers without Python.
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
# The PyO3 bindings. Maturin builds with it (the wheel is unchanged); turn it off
# (`--no-default-features`) to get the pure-Rust parsers without a Python toolchain.
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"], optional = true }
numpy = { version = "0.29", optional = true }
# Tile and patch codecs only; AVIF, TIFF and the rest would add build time and dependencies.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# JPEG patch writer: 4:2:0 / 4:4:4 chroma, which the image crate cannot write.
jpeg-encoder = { version = "0.7", features = ["simd"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rayon = "1"
quick-xml = { version = "0.42", features = ["encoding"] }
# GeoTIFF chunk codecs (src/geotiff); all but zstd are already used by `image`.
bytemuck = "1"
flate2 = "1"
# Fast zlib compressor (the one `image` uses for PNG): GeoTIFF patches at level 0.
fdeflate = "0.3"
weezl = "0.2"
zune-jpeg = "0.5"
image-webp = "0.2"
zstd = { version = "0.14", default-features = false }

[lints.rust]
missing_docs = "deny"

[lints.clippy]
pedantic = "deny"
