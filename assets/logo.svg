<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Original tile-grid icon, but with the world map showing through the tiles. -->
  <defs>
    <!-- Clip the world map into the union of the 9 tile rectangles, so the
         gaps cut through continents like a real tile grid over satellite imagery. -->
    <clipPath id="tiles-clip">
      <rect x="19"  y="19"  width="64" height="64" rx="5"/>
      <rect x="88"  y="19"  width="64" height="64" rx="5"/>
      <rect x="157" y="19"  width="64" height="64" rx="5"/>
      <rect x="19"  y="88"  width="64" height="64" rx="5"/>
      <rect x="88"  y="88"  width="64" height="64" rx="5"/>
      <rect x="157" y="88"  width="64" height="64" rx="5"/>
      <rect x="19"  y="157" width="64" height="64" rx="5"/>
      <rect x="88"  y="157" width="64" height="64" rx="5"/>
      <rect x="157" y="157" width="64" height="64" rx="5"/>
    </clipPath>
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#FFFFFF" stroke-width="0.3" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background (visible in the gaps between tiles) -->
  <rect width="240" height="240" fill="#0D1117" rx="22"/>

  <!-- Everything inside the tile shapes (base color, map, texture) -->
  <g clip-path="url(#tiles-clip)">
    <!-- Tile base colors: subtle variation per tile, ocean-blue feel -->
    <rect x="19"  y="19"  width="64" height="64" fill="#0C2030"/>
    <rect x="88"  y="19"  width="64" height="64" fill="#0E2538"/>
    <rect x="157" y="19"  width="64" height="64" fill="#0B1E2E"/>
    <rect x="19"  y="88"  width="64" height="64" fill="#0E2538"/>
    <rect x="88"  y="88"  width="64" height="64" fill="#112C42"/>
    <rect x="157" y="88"  width="64" height="64" fill="#0D2338"/>
    <rect x="19"  y="157" width="64" height="64" fill="#0B1E2E"/>
    <rect x="88"  y="157" width="64" height="64" fill="#0D2338"/>
    <rect x="157" y="157" width="64" height="64" fill="#0C2030"/>

    <!-- World map (Wikimedia Simple_world_map.svg, CC0).
         Shifted right + slightly zoomed so the Americas (western hemisphere)
         sit center-frame instead of the Atlantic ocean. -->
    <g transform="translate(25.5, 45.5) scale(0.62)">
      <path
        d="m275.9 201.8-1.4 1.46h-2.36v-2.15l1.83-1.18h1.93v1.87zm4.05-6.3v2.12l-1.8-1.08v-1.65h1.8v-5.97h-4.6l-10.94 7.33-2.69-3.09v6.07h-6.65l3.86 10.57h12.67l9.75-11.28 0.44-3.05-1.84 0.03zm-171.6-119.4 2.52-1.719h3.04l-2.51 1.719h-3.05zm22.97-9.127-3.22 2.792h-7.46l-2.31 1.582h1.78l-2.48 1.692h-1.77l2.47-1.692h-4.87l-2.11 1.64-2.15 0.215 0.43-3.705h-1.66l-1.94 1.289-3.6 5.315h-2.12l4.08-6.604 4.81-1.029-0.27-0.903-3.17-0.108-1.5-0.913-1.88 0.913h-2.2l0.9-1.945-4.551-2.082h-38.81l-12.78 13.48v10.36l4.666 4.667 16.32 2.098 2.177 3.302 4.59-0.161 3.788 7.44 7.058-8.861 16.78 0.053 1.11 8.388 2.66 0.07 0.07-10.44 27.16-23.22 1.85-0.32 1.05-3.307h-2.9zm16.06-1.435h9.48l-1.97-3.138-1.78-0.425v-2.251zm-70.28 50.76-3.657-7.88 3.036-3.81-3.787-7.442-4.59 0.161-2.177-3.301-16.32-2.098 0.031 0.032 0.695 7.348 5.02 9.5 2.057-1.59-3.959-8.441v-4.751h2.335l0.091 4.419 7.5 17.62 12.23 5.1 3.052-0.81 2.686 2.74 1.338-2.38h2.818l-0.402-3.09h2.415l3.141-2.34 0.133-3.41-3.435-0.06-2.731 4.48zm135.4-76.39 4.54-2.209v-0.622l-2.25-2.282-3.15 1.046-3.78-0.08-0.8 1.09-2.15-0.05v2.02zm40.41 47.95 0.01-2.144-2.43-0.064-0.02 1.58zm-92.08-68.56v2.26l11.28 0.161 2.89 4.987v4.51l-5.41 3.073 0.16 6.12 3.4 3.437h4.02l6.14-6.489 8.67-2.557 3.25-2.489 6.56-0.405 4.59-1.355 8.65-13.75 5.33-1.09 1.88-1.89-15.37-1.546-13.28 1.546h-16.08l-9.27 3.221zm261.6 87.05-1.31-1.37-2.15 3.06 2.15 2.01zm-20.64-37.93 0.43-2.416-4.51-0.725-1.72-2.819h-8.59l-17.56-4.348-1.93 4.348-7.14-2.174-5.33 4.06 17.36 10.14 20.08 0.215 2.42-4.924zm3.81 45.98-2.58 0.57v1.52l1.05 1.27 1.53-1.91zm-9.61-51.94 1.72 2.819 4.51 0.725-0.43 2.416-6.48 1.357-2.43 4.924-20.08-0.215-17.36-10.14-7.51 5.725 1.25 5.811-7.52 2.793 2.15 5.26 8 3.65 0.32 6.443 20.94 7.242 3.86-3.538 8.22 3.538-1.13 3.06 4.35 7.25 7.62-3.86 4.98 4.26 2.11-1.2 0.08 2.05 12.48-4.46 4.08-9.132-7.28-11.98 3.74-4.079h-4.3l-1.38 0.893-2.7-4.435 3.44-3.007 2.36 4.504 3.31-2.277 6.35-4.374v-8.483l-10.52-2.684-7.73-7.571h-7.51l1.71 6.067z"
        fill="#27537F"
        fill-rule="evenodd"
        opacity="0.85"/>
    </g>

    <!-- Scanline texture on top of map and tiles -->
    <rect x="19"  y="19"  width="202" height="202" fill="url(#scanlines)"/>
  </g>

  <!-- === Polygon segmentation label === (drawn on top, spans gaps too) -->
  <polygon
    points="84,33  176,22  221,90  210,185  128,220  44,196  24,114  58,44"
    fill="#38BDF8"
    fill-opacity="0.07"
    stroke="#38BDF8"
    stroke-width="2"
    stroke-linejoin="round"/>

  <!-- Tile highlights inside the polygon (clipped to tiles for clean edges) -->
  <g clip-path="url(#tiles-clip)">
    <rect x="88"  y="19"  width="64" height="64" fill="#38BDF8" fill-opacity="0.10"/>
    <rect x="157" y="19"  width="64" height="64" fill="#38BDF8" fill-opacity="0.08"/>
    <rect x="88"  y="88"  width="64" height="64" fill="#38BDF8" fill-opacity="0.16"/>
    <rect x="157" y="88"  width="64" height="64" fill="#38BDF8" fill-opacity="0.12"/>
    <rect x="88"  y="157" width="64" height="64" fill="#38BDF8" fill-opacity="0.10"/>
    <rect x="157" y="157" width="64" height="64" fill="#38BDF8" fill-opacity="0.06"/>
    <rect x="19"  y="88"  width="64" height="64" fill="#38BDF8" fill-opacity="0.05"/>
    <rect x="19"  y="157" width="64" height="64" fill="#38BDF8" fill-opacity="0.04"/>
  </g>

  <!-- Polygon vertex dots -->
  <circle cx="84"  cy="33"  r="3" fill="#38BDF8"/>
  <circle cx="176" cy="22"  r="3" fill="#38BDF8"/>
  <circle cx="221" cy="90"  r="3" fill="#38BDF8"/>
  <circle cx="210" cy="185" r="3" fill="#38BDF8"/>
  <circle cx="128" cy="220" r="3" fill="#38BDF8"/>
  <circle cx="44"  cy="196" r="3" fill="#38BDF8"/>
  <circle cx="24"  cy="114" r="3" fill="#38BDF8"/>
  <circle cx="58"  cy="44"  r="3" fill="#38BDF8"/>
</svg>
