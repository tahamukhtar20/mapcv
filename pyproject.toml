[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "mapcv"
version = "0.2.0"
description = "A high-performance satellite imagery dataset creation tool for computer vision"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES-THIRD-PARTY.md"]
authors = [
    { name = "Muhammad Taha Mukhtar", email = "tahamukhtar20@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
keywords = [
    "remote-sensing",
    "satellite-imagery",
    "semantic-segmentation",
    "computer-vision",
    "dataset",
    "geospatial",
    "sentinel-2",
    "xyz-tiles",
]
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "shapely>=2.0",
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "typing_extensions>=4.6",
    "pyproj>=3.6",
    "pyshp>=3.0",
]

[project.urls]
Homepage = "https://tahamukhtar20.github.io/mapcv/"
Documentation = "https://tahamukhtar20.github.io/mapcv/"
Repository = "https://github.com/tahamukhtar20/mapcv"
Issues = "https://github.com/tahamukhtar20/mapcv/issues"
Changelog = "https://github.com/tahamukhtar20/mapcv/blob/main/CHANGELOG.md"

[project.scripts]
mapcv = "mapcv.cli:app"

[project.optional-dependencies]
dev = [
    "maturin",
    "pytest",
    "pytest-httpserver",
    "mypy",
    "ruff",
    "pre-commit",
    "mercantile",
    "pytest-cov",
]
# GeoParquet label files; GeoPackage and Shapefile labels need no extra.
parquet = [
    "pyarrow>=14",
]
# `mapcv export --format hf-parquet` (Hugging Face Parquet).
export = [
    "pyarrow>=14",
]
docs = [
    "matplotlib",
    "ipywidgets",
]
# numcodecs, required by zarr 2, has no Python 3.14 wheels; the extra is
# limited to Python < 3.14 until xarray-eopf supports zarr 3.
zarr = [
    "xarray-eopf==0.2.5; python_version < '3.11'",
    "xarray-eopf>=0.2.9,<0.3; python_version >= '3.11' and python_version < '3.14'",
    # xarray 2026.9 needs zarr 3, which xarray-eopf does not support yet.
    "xarray>=2024.10,<2026.9; python_version < '3.14'",
    "dask[array]>=2024.10; python_version < '3.14'",
    "numba>=0.68; python_version < '3.14'",  # 0.68 is the first to support numpy 2.5
    "zarr>=2.18,<3; python_version < '3.14'",
    "pyproj>=3.6; python_version < '3.14'",
    "s3fs>=2024.10; python_version < '3.14'",
    # xarray-eopf imports pystac_client when it registers the eopf-zarr engine but does
    # not declare it; without it the engine fails to load.
    "pystac-client>=0.8; python_version < '3.14'",
]

# Google Earth Engine imagery (imagery.earth_engine); the Apache-2.0 earthengine-api.
gee = [
    "earthengine-api>=1.0",
]

# The MCP server for AI agents (`mapcv mcp`); the official MCP Python SDK (MIT).
mcp = [
    "mcp>=2.3,<3",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "mapcv._mapcv_rs"
python-source = "src"
# Keep the sdist to what is needed to build and test: no docs site, CI config,
# or notebooks (the demo notebook embeds third-party imagery).
exclude = [
    { path = "website/**/*", format = "sdist" },
    { path = "examples/**/*", format = "sdist" },
    { path = "benchmarks/**/*", format = "sdist" },
    { path = "fuzz/**/*", format = "sdist" },
    { path = ".github/**/*", format = "sdist" },
    { path = "uv.lock", format = "sdist" },
    { path = ".pre-commit-config.yaml", format = "sdist" },
    { path = "cliff.toml", format = "sdist" },
    { path = "deny.toml", format = "sdist" },
    { path = "about.toml", format = "sdist" },
    { path = "about.hbs", format = "sdist" },
    { path = "AGENTS.md", format = "sdist" },
    { path = "CLAUDE.md", format = "sdist" },
    # The Claude Code plugin and the agent skill live in the repository only.
    { path = "agent/**/*", format = "sdist" },
    { path = ".claude-plugin/**/*", format = "sdist" },
    # Builds from the sdist use the builder's own Rust, not the CI pin.
    { path = "rust-toolchain.toml", format = "sdist" },
]

[tool.mypy]
strict = true
exclude = ["tests/generate_golden\\.py", "tests/generate_vector_fixtures\\.py"]

[[tool.mypy.overrides]]
module = [
    "mercantile",
    "shapely",
    "shapely.*",
    "rasterio",
    "rasterio.*",
    "yaml",
    "xarray",
    "xarray.*",
    "zarr",
    "zarr.*",
    "pyproj",
    "pyproj.*",
    "shapefile",
    "pyarrow",
    "pyarrow.*",
    "psutil",
    "affine",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
# The docs site's code blocks are API signature sketches, not runnable code.
extend-exclude = ["website"]

[tool.ruff.lint]
# ruff 0.16 enables many more rules by default; keep the established set until
# the codebase is migrated to the new defaults in its own change.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_benchmarks.py imports the benchmarks/ package from the repository root.
pythonpath = ["."]
markers = [
    "eopf_live: opt-in integration test against a public EOPF product",
]

[tool.coverage.run]
branch = true
source = ["mapcv"]
omit = [
    "src/mapcv/_mapcv_rs*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    # The benchmark harness is exercised by a quick smoke test in tests/.
    { include-group = "bench" },
    { include-group = "test" },
]
# Reference implementations the test suite checks mapcv's outputs against.
test = [
    "hypothesis>=6.100",
    "pycocotools>=2.0.8",
]
# Only the benchmark suite in benchmarks/ needs these; mapcv itself does not.
bench = [
    "psutil>=5.9",
    "pyproj>=3.6",
    "rasterio>=1.3",
]
golden = [
    "geopandas>=0.14",
    "mercantile>=1.2",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "shapely>=2",
]
