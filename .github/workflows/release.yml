name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Version consistency check ─────────────────────────────────────────────────
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches pyproject.toml and Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          CARGO=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          echo "Tag:          $TAG"
          echo "pyproject.toml: $PYPROJECT"
          echo "Cargo.toml:     $CARGO"

          if [ "$TAG" != "$PYPROJECT" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $PYPROJECT"
            exit 1
          fi
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CARGO"
            exit 1
          fi
          echo "All versions match: $TAG"

  # ── Linux (manylinux, x86-64) ────────────────────────────────────────────────
  linux:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          command: build
          # abi3 (cp310-abi3): one wheel serves Python 3.10 and newer.
          args: --release --sdist -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: dist

  # ── macOS (universal2 — runs on both Intel and Apple Silicon) ────────────────
  macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: universal2-apple-darwin
          args: --release -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos
          path: dist

  # ── Windows (x86-64) ─────────────────────────────────────────────────────────
  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows
          path: dist

  # ── Test the Linux wheels on every supported Python before publishing ────────
  test-wheel:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Check distribution metadata
        run: |
          pip install twine
          twine check --strict dist/*
          python - <<'EOF'
          import glob, zipfile
          from email.parser import Parser
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheels built"
          assert all("-cp310-abi3-" in whl for whl in wheels), wheels
          for whl in wheels:
              with zipfile.ZipFile(whl) as zf:
                  name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
                  meta = Parser().parsestr(zf.read(name).decode())
              assert meta["Requires-Python"] == ">=3.10", (whl, meta["Requires-Python"])
              classifiers = meta.get_all("Classifier") or []
              for minor in ("3.10", "3.11", "3.12", "3.13", "3.14"):
                  assert f"Programming Language :: Python :: {minor}" in classifiers, (whl, minor)
          print(f"metadata OK for {len(wheels)} wheels")
          EOF
      - name: Install wheel and test dependencies
        run: |
          pip install --find-links dist mapcv
          python -c "import mapcv"
          if [ "${{ matrix.python }}" != "3.14" ]; then
            pip install --find-links dist 'mapcv[zarr]'
            python -c "import xarray; import xarray_eopf"
          fi
          pip install pytest pytest-httpserver pytest-cov mercantile
      - name: Run tests
        run: pytest --cov=mapcv --cov-branch --cov-fail-under=65

  # ── Generate changelog + publish ─────────────────────────────────────────────
  publish:
    needs: test-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Generate release notes with git-cliff
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --current --strip header

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.whl
          body: ${{ steps.cliff.outputs.content }}
