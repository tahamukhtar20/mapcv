[package]
name = "mapcv_rs"
version = "0.2.0"
edition = "2021"

[lib]
name = "_mapcv_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
numpy = "0.29"
# Tile and patch codecs only; AVIF, TIFF and the rest would add build time and dependencies.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rayon = "1"
quick-xml = { version = "0.42", features = ["encoding"] }

[lints.rust]
missing_docs = "deny"

[lints.clippy]
pedantic = "deny"
